<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Fretbored — guitar scales, chords, circle of fifths and a precise metronome, right in your browser.">
  <meta name="theme-color" content="#0c0f14">
  <title>Fretbored</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a2132'/%3E%3Cpath d='M3 8.5h26M3 15.5h26M3 22.5h26' stroke='%23e3e7ef' stroke-width='1.6' opacity='.5'/%3E%3Ccircle cx='12' cy='15.5' r='7' fill='none' stroke='%23ff7a59' stroke-width='1.6' opacity='.55'/%3E%3Ccircle cx='12' cy='15.5' r='5' fill='%23ff7a59'/%3E%3Ccircle cx='24' cy='8.5' r='4.2' fill='%237c6cff'/%3E%3Ccircle cx='24' cy='22.5' r='4.2' fill='%237c6cff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fretbored">
  <!-- The web app manifest is linked from js/app.js on http(s) only (browsers refuse it on file://). -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#scales" aria-label="Fretbored home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#1a2132"/>
        <path d="M3 8.5h26M3 15.5h26M3 22.5h26" stroke="#e3e7ef" stroke-width="1.6" opacity=".5"/>
        <circle cx="12" cy="15.5" r="7" fill="none" stroke="#ff7a59" stroke-width="1.6" opacity=".55"/>
        <circle cx="12" cy="15.5" r="5" fill="#ff7a59"/>
        <circle cx="24" cy="8.5" r="4.2" fill="#7c6cff"/>
        <circle cx="24" cy="22.5" r="4.2" fill="#7c6cff"/>
      </svg>
      <span>Fret<b>bored</b></span>
    </a>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-scales" data-tab="scales" aria-controls="panel-scales">Scales</button>
      <button role="tab" id="tab-chords" data-tab="chords" aria-controls="panel-chords">Chords</button>
      <button role="tab" id="tab-arpeggios" data-tab="arpeggios" aria-controls="panel-arpeggios">Arpeggios</button>
      <button role="tab" id="tab-trainer" data-tab="trainer" aria-controls="panel-trainer">Trainer</button>
      <button role="tab" id="tab-circle" data-tab="circle" aria-controls="panel-circle">Circle<span class="long"> of Fifths</span></button>
      <button role="tab" id="tab-tuner" data-tab="tuner" aria-controls="panel-tuner">Tuner</button>
      <button role="tab" id="tab-metronome" data-tab="metronome" aria-controls="panel-metronome">Metronome</button>
    </nav>
    <div class="top-actions">
      <button id="install-app" class="btn primary small install-btn" hidden title="Install Fretbored as an app">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4a1 1 0 0 1 1-1zM5 19h14a1 1 0 1 1 0 2H5a1 1 0 1 1 0-2z"/></svg>
        <span>Install</span>
      </button>
      <div class="theme-picker">
        <button id="theme-btn" class="icon-btn" title="Colour theme" aria-label="Colour theme" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0 0 20c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a5 5 0 0 0 5-5C22 6 17.5 2 12 2zM6.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
        </button>
        <div id="theme-menu" class="theme-menu" role="menu" aria-label="Colour theme" hidden></div>
      </div>
      <a class="icon-btn github" href="https://github.com/singularity098/fretbored" target="_blank" rel="noopener" title="View on GitHub" aria-label="Fretbored on GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section id="panel-scales" class="panel" role="tabpanel" aria-labelledby="tab-scales" hidden></section>
    <section id="panel-chords" class="panel" role="tabpanel" aria-labelledby="tab-chords" hidden></section>
    <section id="panel-arpeggios" class="panel" role="tabpanel" aria-labelledby="tab-arpeggios" hidden></section>
    <section id="panel-trainer" class="panel" role="tabpanel" aria-labelledby="tab-trainer" hidden></section>
    <section id="panel-circle" class="panel" role="tabpanel" aria-labelledby="tab-circle" hidden></section>
    <section id="panel-tuner" class="panel" role="tabpanel" aria-labelledby="tab-tuner" hidden></section>
    <section id="panel-metronome" class="panel" role="tabpanel" aria-labelledby="tab-metronome" hidden></section>
  </main>

  <footer class="footer">
    Fretbored · works offline · <a href="https://github.com/singularity098/fretbored" target="_blank" rel="noopener">source on GitHub</a>
  </footer>

  <dialog id="tuning-editor" aria-label="Custom tuning editor"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Fretbored needs JavaScript enabled.</p></noscript>

  <script src="js/sounds.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/tunings.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/fbcontrols.js"></script>
  <script src="js/nowbar.js"></script>
  <script src="js/scales.js"></script>
  <script src="js/chords.js"></script>
  <script src="js/arpeggios.js"></script>
  <script src="js/circle.js"></script>
  <script src="js/trainer.js"></script>
  <script src="js/metronome.js"></script>
  <script src="js/pitch.js"></script>
  <script src="js/tuner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
